<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinkyStream</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #090909;
    border-bottom: 1px solid #35101a;
    padding: 16px 5%;
}

.navbar {
    display: flex;
    align-items: center;
    gap: 30px;
}

.logo {
    color: #a7193d;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
}

nav {
    display: flex;
    gap: 18px;
    flex: 1;
}

nav a {
    color: #ddd;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
}

nav a:hover {
    color: #c52a50;
}

.search {
    background: #181818;
    border: 1px solid #333;
    color: white;
    padding: 9px 15px;
    border-radius: 20px;
    outline: none;
    width: 190px;
}

/* HERO */

.hero {
    min-height: 400px;
    padding: 80px 7%;
    display: flex;
    align-items: center;

    background:
        linear-gradient(
            90deg,
            #080808 10%,
            rgba(8,8,8,.8),
            rgba(8,8,8,.2)
        ),
        radial-gradient(
            circle at 75% 40%,
            #64172f,
            #190910 50%,
            #080808 80%
        );
}

.hero-content {
    max-width: 650px;
}

.hero h1 {
    font-size: 55px;
    margin-bottom: 15px;
}

.hero h1 span {
    color: #a7193d;
}

.hero p {
    color: #ccc;
    line-height: 1.7;
    margin-bottom: 25px;
}

.btn {
    background: #a7193d;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    background: #c52a50;
}

/* SECTIONS */

.section {
    padding: 40px 5%;
}

.section-title {
    font-size: 26px;
    margin-bottom: 20px;
}

/* CATEGORY BUTTONS */

.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.categories button {
    background: #191919;
    border: 1px solid #333;
    color: #ddd;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
}

.categories button:hover {
    background: #78172f;
}

/* CARDS */

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));

    gap: 18px;
}

.card {
    background: #121212;
    border: 1px solid #222;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
}

.card:hover {
    transform: scale(1.04);
    border-color: #a7193d;
}

.poster {
    height: 250px;
    padding: 15px;
    display: flex;
    align-items: flex-end;
    position: relative;

    background:
        linear-gradient(
            145deg,
            #57142a,
            #151515
        );
}

.play {
    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 58px;
    height: 58px;

    border-radius: 50%;

    background: #a7193d;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;

    opacity: 0;
}

.card:hover .play {
    opacity: 1;
}

.poster-title {
    font-size: 18px;
    font-weight: bold;
}

.card-info {
    padding: 12px;
}

.card-info h3 {
    margin-bottom: 6px;
}

.card-info p {
    color: #888;
    font-size: 12px;
}

/* PLAYER */

#playerScreen {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 5000;

    background: #000;

    overflow-y: auto;
}

.player-header {
    height: 70px;

    background: #090909;

    border-bottom: 1px solid #222;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 4%;
}

.close {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 50%;

    background: #a7193d;
    color: white;

    font-size: 20px;

    cursor: pointer;
}

.video-wrapper {
    width: 92%;
    max-width: 1100px;

    margin: 35px auto;
}

#videoFrame {
    width: 100%;

    aspect-ratio: 16 / 9;

    border: none;

    background: black;
}

.player-description {
    width: 92%;
    max-width: 1100px;

    margin: auto;

    padding-bottom: 50px;
}

.player-description p {
    color: #aaa;

    line-height: 1.6;

    margin-top: 10px;
}

/* FOOTER */

footer {
    margin-top: 50px;

    border-top: 1px solid #222;

    text-align: center;

    padding: 35px;

    color: #777;
}

/* MOBILE */

@media(max-width:800px) {

    .navbar {
        flex-wrap: wrap;
    }

    nav {
        order: 3;
        width: 100%;
        overflow-x: auto;
    }

    .search {
        width: 140px;
    }

    .hero h1 {
        font-size: 38px;
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .poster {
        height: 220px;
    }
}
</style>
</head>


<body>


<!-- NAVIGATION -->

<header>

<div class="navbar">

<div
class="logo"
onclick="showHome()">
TinkyStream
</div>

<nav>

<a onclick="showHome()">Home</a>

<a onclick="showCategory('Movies')">
Movies
</a>

<a onclick="showCategory('Series')">
Series
</a>

<a onclick="showCategory('Anime')">
Anime
</a>

<a onclick="showCategory('Short Dramas')">
Short Dramas
</a>

</nav>

<input
class="search"
id="searchBox"
type="text"
placeholder="Search..."
oninput="searchContent()">

</div>

</header>


<!-- HERO -->

<section class="hero">

<div class="hero-content">

<h1>
Welcome to
<span>TinkyStream</span>
</h1>

<p>
Movies, series, anime and short dramas
all organized in one place.
</p>

<button
class="btn"
onclick="showHome()">
▶ Start Watching
</button>

</div>

</section>


<!-- CATEGORY BUTTONS -->

<section class="section">

<h2 class="section-title">
Browse TinkyStream
</h2>

<div class="categories">

<button onclick="showHome()">
🏠 Home
</button>

<button onclick="showCategory('Movies')">
🎬 Movies
</button>

<button onclick="showCategory('Series')">
📺 Series
</button>

<button onclick="showCategory('Anime')">
🎌 Anime
</button>

<button onclick="showCategory('Short Dramas')">
🎭 Short Dramas
</button>

</div>

</section>


<!-- MOVIES -->

<section
class="section"
id="moviesSection">

<h2 class="section-title">
🎬 Movies
</h2>

<div
class="grid"
id="moviesGrid">
</div>

</section>


<!-- SERIES -->

<section
class="section"
id="seriesSection">

<h2 class="section-title">
📺 Series
</h2>

<div
class="grid"
id="seriesGrid">
</div>

</section>


<!-- ANIME -->

<section
class="section"
id="animeSection">

<h2 class="section-title">
🎌 Anime
</h2>

<div
class="grid"
id="animeGrid">
</div>

</section>


<!-- SHORT DRAMAS -->

<section
class="section"
id="shortDramasSection">

<h2 class="section-title">
🎭 Short Dramas
</h2>

<div
class="grid"
id="shortDramasGrid">
</div>

</section>


<!-- PLAYER -->

<div id="playerScreen">

<div class="player-header">

<h2 id="playerTitle">
Now Playing
</h2>

<button
class="close"
onclick="closePlayer()">
✕
</button>

</div>


<div class="video-wrapper">

<iframe
id="videoFrame"
allow="autoplay; fullscreen; picture-in-picture"
allowfullscreen>
</iframe>

</div>


<div class="player-description">

<h1 id="descriptionTitle"></h1>

<p id="descriptionText"></p>

</div>

</div>


<!-- FOOTER -->

<footer>

<p>
© 2026 TinkyStream
</p>

<br>

<p>
Free and authorized content only.
</p>

</footer>


<script>

/*
====================================================
CONTENT LIBRARY
====================================================

Each item belongs to one category.

The YouTube IDs below are used for the
authorized/open content we are demonstrating.

You can add more authorized titles later.
====================================================
*/


const content = [

/* ================= MOVIES ================= */

{
title: "Big Buck Bunny",
category: "Movies",
year: "2008",
description:
"Blender's famous Open Movie about a peaceful rabbit and the mischievous creatures of the forest.",
youtube: "YE7VzlLtp-4"
},

{
title: "Tears of Steel",
category: "Movies",
year: "2012",
description:
"A science-fiction Open Movie produced by the Blender Foundation.",
youtube: "R6MlUcmOul8"
},

{
title: "Elephants Dream",
category: "Movies",
year: "2006",
description:
"One of Blender's earliest Open Movie projects.",
youtube: "eRsGyueVLvQ"
},


/* ================= SERIES ================= */

/*
These are placeholders for your SERIES section.

We are keeping the section separate now.
You can add authorized episodes here later.
*/

{
title: "Open Series Episode 1",
category: "Series",
year: "Free",
description:
"An authorized free episode can be added here.",
youtube: "YE7VzlLtp-4"
},

{
title: "Open Series Episode 2",
category: "Series",
year: "Free",
description:
"An authorized free episode can be added here.",
youtube: "R6MlUcmOul8"
},


/* ================= ANIME ================= */

{
title: "Sintel",
category: "Anime",
year: "2010",
description:
"An animated fantasy Open Movie from Blender.",
youtube: "eRsGyueVLvQ"
},

{
title: "Sprite Fright",
category: "Anime",
year: "2021",
description:
"A stylized animated Open Movie from Blender Studio.",
youtube: "Mj3M5eG3d3Q"
},


/* ================= SHORT DRAMAS ================= */

{
title: "Spring",
category: "Short Dramas",
year: "2019",
description:
"An animated short film from Blender's Open Movie collection.",
youtube: "WhWc3b3KhnY"
},

{
title: "Coffee Run",
category: "Short Dramas",
year: "2020",
description:
"A short animated film from Blender Studio.",
youtube: "c4J8u4qYb6I"
}

];


/*
====================================================
CREATE CARD
====================================================
*/

function createCard(item) {

const card =
document.createElement("div");

card.className = "card";


card.innerHTML = `

<div class="poster">

<div class="play">
▶
</div>

<div class="poster-title">
${item.title}
</div>

</div>

<div class="card-info">

<h3>
${item.title}
</h3>

<p>
${item.category} • ${item.year}
</p>

</div>

`;


card.onclick = function() {

openPlayer(item);

};


return card;

}


/*
====================================================
DISPLAY CATEGORY
====================================================
*/

function displayCategory(
category,
gridId
) {

const grid =
document.getElementById(gridId);

grid.innerHTML = "";


const items =
content.filter(
item =>
item.category === category
);


items.forEach(item => {

grid.appendChild(
createCard(item)
);

});

}


/*
====================================================
LOAD EVERYTHING
====================================================
*/

function loadAll() {

displayCategory(
"Movies",
"moviesGrid"
);

displayCategory(
"Series",
"seriesGrid"
);

displayCategory(
"Anime",
"animeGrid"
);

displayCategory(
"Short Dramas",
"shortDramasGrid"
);

}


/*
====================================================
SHOW CATEGORY
====================================================
*/

function showCategory(category) {

const sections = {

"Movies":
"moviesSection",

"Series":
"seriesSection",

"Anime":
"animeSection",

"Short Dramas":
"shortDramasSection"

};


const section =
document.getElementById(
sections[category]
);


if(section) {

section.scrollIntoView({
behavior: "smooth"
});

}

}


/*
====================================================
HOME
====================================================
*/

function showHome() {

document.getElementById(
"searchBox"
).value = "";


document.getElementById(
"moviesSection"
).style.display = "block";

document.getElementById(
"seriesSection"
).style.display = "block";

document.getElementById(
"animeSection"
).style.display = "block";

document.getElementById(
"shortDramasSection"
).style.display = "block";


window.scrollTo({

top: 0,

behavior: "smooth"

});

}


/*
====================================================
SEARCH
====================================================
*/

function searchContent() {

const query =
document.getElementById(
"searchBox"
).value
.toLowerCase()
.trim();


const sections = [

"moviesSection",
"seriesSection",
"animeSection",
"shortDramasSection"

];


if(query === "") {

showHome();

return;

}


/*
Hide every section first.
*/

sections.forEach(
id => {

document.getElementById(
id
).style.display = "none";

});


/*
Create search results
inside Movies section.
*/

const results =
content.filter(item =>

item.title
.toLowerCase()
.includes(query)

||

item.category
.toLowerCase()
.includes(query)

);


const moviesSection =
document.getElementById(
"moviesSection"
);


moviesSection.style.display =
"block";


const grid =
document.getElementById(
"moviesGrid"
);


grid.innerHTML = "";


results.forEach(item => {

grid.appendChild(
createCard(item)
);

});

}


/*
====================================================
OPEN PLAYER
====================================================
*/

function openPlayer(item) {

const screen =
document.getElementById(
"playerScreen"
);

const frame =
document.getElementById(
"videoFrame"
);


document.getElementById(
"playerTitle"
).textContent =
item.title;


document.getElementById(
"descriptionTitle"
).textContent =
item.title;


document.getElementById(
"descriptionText"
).textContent =
item.description;


/*
Load YouTube video.
*/

frame.src =
"https://www.youtube.com/embed/"
+
item.youtube
+
"?autoplay=1&rel=0";


screen.style.display =
"block";


document.body.style.overflow =
"hidden";

}


/*
====================================================
CLOSE PLAYER
====================================================
*/

function closePlayer() {

const screen =
document.getElementById(
"playerScreen"
);

const frame =
document.getElementById(
"videoFrame"
);


frame.src = "";


screen.style.display =
"none";


document.body.style.overflow =
"auto";

}


/*
====================================================
START
====================================================
*/

loadAll();

</script>

</body>
</html>
